<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#043026" />
    </linearGradient>
    <filter id="pcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield Base -->
  <path d="M50 8 C68 8, 86 16, 86 32 C86 62, 50 90, 50 90 C50 90, 14 62, 14 32 C14 16, 32 8, 50 8 Z" 
        fill="url(#shieldGrad)" filter="url(#pcShadow)"/>

  <!-- Inner Stroke / Highlight -->
  <path d="M50 13 C64 13, 80 20, 80 34 C80 59, 50 82, 50 82 C50 82, 20 59, 20 34 C20 20, 36 13, 50 13 Z" 
        stroke="url(#pcGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Medical Cross with Rounded Edges -->
  <rect x="43" y="27" width="14" height="42" rx="7" fill="#ffffff" />
  <rect x="29" y="41" width="42" height="14" rx="7" fill="#ffffff" />

  <!-- Center Accent Leaf/Pill Pulse -->
  <circle cx="50" cy="48" r="5" fill="#34d399" />
</svg>
